<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Kylie Sparks</title>
  <meta name="description" content="You've wandered off the beaten path. Let me help you find your way back.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicons -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg">

  <style>
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      --radius:      0.75rem;
      --max-width:   32rem;
      --bg:          #ffffff;
      --surface:     #faf9f8;
      --stroke:      #e4e3e1;
      --text:        #1a1a1a;
      --muted:       #6b6b6b;
      --link:        #2563eb;
      --link-hover:  #1d4ed8;
      --accent:      #7c3aed;
      --accent-dim:  #e8eaf8;
    }
    [data-theme="dark"] {
      --bg:          #0a0a0a;
      --surface:     #141414;
      --stroke:      #2a2a2a;
      --text:        #e5e5e5;
      --muted:       #9a9a9a;
      --link:        #60a5fa;
      --link-hover:  #93c5fd;
      --accent:      #a78bfa;
      --accent-dim:  #1a1428;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      line-height: 1.7;
      background: var(--bg);
      color: var(--text);
      border-left: 1px solid var(--stroke);
      border-right: 1px solid var(--stroke);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: var(--max-width);
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 800;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      color: var(--muted);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-emoji { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      font-weight: 500;
      transition: 0.2s ease;
    }
    .home-link:hover {
      background: var(--link);
      color: white;
      transform: translateY(-1px);
    }
    .footer-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2rem;
    }
    .footer-note a { color: var(--link); }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: 0.2s ease;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .theme-toggle:hover {
      border-color: var(--link);
      background: var(--accent-dim);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌓</button>

  <div class="container">
    <div class="error-emoji">🔍</div>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>
      You’ve wandered off the beaten path — this page doesn’t exist (yet).
      Let me help you find your way back.
    </p>
    <a class="home-link" href="https://kyliesparks.github.io/kyliesparks/">← Back to home</a>
    <p class="footer-note">
      Or explore my <a href="https://github.com/kyliesparks">GitHub</a> or
      <a href="https://kylie-sparks.dev">personal site</a>.
    </p>
  </div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      root.setAttribute('data-theme', 'dark');
      toggle.textContent = '☀️';
    }
    toggle.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      if (isDark) {
        root.removeAttribute('data-theme');
        toggle.textContent = '🌓';
        localStorage.setItem('theme', 'light');
      } else {
        root.setAttribute('data-theme', 'dark');
        toggle.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
</body>
</html>
